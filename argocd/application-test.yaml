apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bluegreen-demo-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahulnayak11631/argorollouts-bluegreen.git
    targetRevision: main
    path: k8s/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
