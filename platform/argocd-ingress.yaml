# Applied manually with kubectl (not via ArgoCD GitOps - this is cluster
# infrastructure for ArgoCD's own UI, not part of the sample app).
# Requires the argocd Helm release installed with:
#   server.extraArgs: ["--insecure", "--rootpath=/argocd"]
#   configs.cm.url: "https://ai-poc-ingress:31083/argocd"
#
# NOTE: unlike the other apps on this ingress, this one does NOT rewrite the
# path. argocd-server already expects to receive requests WITH the /argocd
# prefix (that's what --rootpath does internally) - rewriting it away to "/"
# made argocd-server itself return 404. Confirmed by testing directly against
# the Service via `kubectl port-forward` (200 with the prefix kept, 404 once
# nginx's rewrite-target stripped it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-poc-ingress
      secretName: ingress-tls
  rules:
    - host: ai-poc-ingress
      http:
        paths:
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
