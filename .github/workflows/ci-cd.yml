name: Build, deploy to dev, gate, promote to test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # the deploy jobs commit image-tag bumps back to k8s/overlays/*

# A manual workflow_dispatch fired right after a push that also matches the
# paths filter (e.g. editing this workflow file itself) starts two runs for
# the same commit - both try to "git push" the same overlay bump and one
# loses as a non-fast-forward. Queue same-ref runs instead of racing them.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: rahulnayak11631/bluegreen-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

  deploy-dev:
    needs: build-and-push
    runs-on: [self-hosted, poc-cluster]
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUBECONFIG: /home/ec2-user/.kube/ci-deployer.config
    steps:
      - uses: actions/checkout@v4

      - name: Bump dev overlay image tag + APP_VERSION
        run: |
          set -euo pipefail
          cd k8s/overlays/dev
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          yq -i '(.[] | select(.path == "/spec/template/spec/containers/0/env/0/value")).value = strenv(TAG)' patch-rollout.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/dev
          git commit -m "deploy(dev): bump image to ${TAG}" || echo "nothing to commit"
          git pull --rebase
          git push

      # Talks to argocd-server's in-cluster ClusterIP directly (not through
      # the public ingress/NodePort). The runner is a plain host process on
      # worker-02, not a pod, so it can't use cluster DNS - the ClusterIP
      # itself is still reachable from any node via kube-proxy, and it's
      # both far more reliable and much faster than the ingress hairpin
      # path (which intermittently failed with connection timeout/EOF under
      # this same loopback-NodePort route - see docs/IMPLEMENTATION-STEPS.md).
      # `--auth-token` also goes directly on the command, not via `argocd
      # login` first - `login` doesn't accept --auth-token and silently
      # falls back to an interactive username/password prompt instead.
      - name: ArgoCD sync (dev)
        run: |
          set -euo pipefail
          argocd app sync bluegreen-demo-dev \
            --server "${{ secrets.ARGOCD_SERVER }}" --plaintext --grpc-web --grpc-web-root-path argocd \
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --timeout 180

      # Paused = normal case (awaiting our promote). Healthy = the very
      # first revision ever, which Argo Rollouts auto-completes since
      # there's no previous stable version to diff against.
      - name: Wait for preview to be ready
        run: bash ci/scripts/wait-for-phase.sh dev Paused,Healthy 180

      - id: smoke
        name: Smoke test dev preview
        run: bash ci/scripts/smoke-test.sh /dev-bluegreen-preview "${TAG}"

      - name: Promote dev (smoke test passed)
        if: success()
        run: |
          set -euo pipefail
          PHASE=$(kubectl get rollout bluegreen-demo -n dev -o jsonpath='{.status.phase}')
          if [ "$PHASE" == "Paused" ]; then
            kubectl argo rollouts promote bluegreen-demo -n dev
          else
            echo "Rollout already at phase=${PHASE} (first revision auto-completes with nothing to promote) - skipping promote"
          fi
          bash ci/scripts/wait-for-phase.sh dev Healthy 180

      - name: Abort dev (smoke test failed)
        if: failure() && steps.smoke.outcome == 'failure'
        run: kubectl argo rollouts abort bluegreen-demo -n dev

  deploy-test:
    needs: deploy-dev
    if: success()
    runs-on: [self-hosted, poc-cluster]
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUBECONFIG: /home/ec2-user/.kube/ci-deployer.config
    steps:
      - uses: actions/checkout@v4

      - name: Bump test overlay image tag + APP_VERSION
        run: |
          set -euo pipefail
          cd k8s/overlays/test
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          yq -i '(.[] | select(.path == "/spec/template/spec/containers/0/env/0/value")).value = strenv(TAG)' patch-rollout.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/test
          git commit -m "deploy(test): bump image to ${TAG}" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: ArgoCD sync (test)
        run: |
          set -euo pipefail
          argocd app sync bluegreen-demo-test \
            --server "${{ secrets.ARGOCD_SERVER }}" --plaintext --grpc-web --grpc-web-root-path argocd \
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --timeout 180

      - name: Wait for test rollout to auto-promote (Healthy)
        run: bash ci/scripts/wait-for-phase.sh test Healthy 180

      - name: Smoke test test active
        run: bash ci/scripts/smoke-test.sh /test-bluegreen "${TAG}"
