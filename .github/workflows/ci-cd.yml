name: Build, deploy to dev, gate, promote to test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # the deploy jobs commit image-tag bumps back to k8s/overlays/*

env:
  IMAGE: rahulnayak11631/bluegreen-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

  deploy-dev:
    needs: build-and-push
    runs-on: [self-hosted, poc-cluster]
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUBECONFIG: /home/ec2-user/.kube/ci-deployer.config
    steps:
      - uses: actions/checkout@v4

      - name: Bump dev overlay image tag + APP_VERSION
        run: |
          set -euo pipefail
          cd k8s/overlays/dev
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          yq -i '(.[] | select(.path == "/spec/template/spec/containers/0/env/0/value")).value = strenv(TAG)' patch-rollout.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/dev
          git commit -m "deploy(dev): bump image to ${TAG}" || echo "nothing to commit"
          git push

      - name: ArgoCD sync (dev)
        run: |
          set -euo pipefail
          argocd login "${{ secrets.ARGOCD_SERVER }}" --grpc-web --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}"
          argocd app sync bluegreen-demo-dev --timeout 180

      - name: Wait for preview to be ready (Paused)
        run: ./ci/scripts/wait-for-phase.sh dev Paused 180

      - id: smoke
        name: Smoke test dev preview
        run: ./ci/scripts/smoke-test.sh /dev-bluegreen-preview "${TAG}"

      - name: Promote dev (smoke test passed)
        if: success()
        run: |
          kubectl argo rollouts promote bluegreen-demo -n dev
          ./ci/scripts/wait-for-phase.sh dev Healthy 180

      - name: Abort dev (smoke test failed)
        if: failure() && steps.smoke.outcome == 'failure'
        run: kubectl argo rollouts abort bluegreen-demo -n dev

  deploy-test:
    needs: deploy-dev
    if: success()
    runs-on: [self-hosted, poc-cluster]
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUBECONFIG: /home/ec2-user/.kube/ci-deployer.config
    steps:
      - uses: actions/checkout@v4

      - name: Bump test overlay image tag + APP_VERSION
        run: |
          set -euo pipefail
          cd k8s/overlays/test
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          yq -i '(.[] | select(.path == "/spec/template/spec/containers/0/env/0/value")).value = strenv(TAG)' patch-rollout.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/test
          git commit -m "deploy(test): bump image to ${TAG}" || echo "nothing to commit"
          git push

      - name: ArgoCD sync (test)
        run: |
          set -euo pipefail
          argocd login "${{ secrets.ARGOCD_SERVER }}" --grpc-web --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}"
          argocd app sync bluegreen-demo-test --timeout 180

      - name: Wait for test rollout to auto-promote (Healthy)
        run: ./ci/scripts/wait-for-phase.sh test Healthy 180

      - name: Smoke test test active
        run: ./ci/scripts/smoke-test.sh /test-bluegreen "${TAG}"
