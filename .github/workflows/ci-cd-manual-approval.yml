name: Build, deploy to dev, MANUAL approval, promote to test

# Manual trigger only (workflow_dispatch), not on push - this is a second,
# separate pipeline you choose to run instead of the fully-automated
# ci-cd.yml, not something that fires on every commit alongside it. It's
# identical through the dev smoke-test gate; the difference is what happens
# next: instead of auto-promoting into test, it pauses for a human
# (rahulnayak11631, the required reviewer on the "test-promotion" GitHub
# Environment - see repo Settings > Environments) to click Review deployments
# > Approve in the Actions UI before test is ever touched.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Same group name as ci-cd.yml on purpose: both pipelines mutate the same
# Rollout objects in dev/test, so only one of them should ever be mid-flight
# against a given ref at a time.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: rahulnayak11631/bluegreen-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

  deploy-dev:
    needs: build-and-push
    runs-on: [self-hosted, poc-cluster]
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUBECONFIG: /home/ec2-user/.kube/ci-deployer.config
    steps:
      - uses: actions/checkout@v4

      - name: Bump dev overlay image tag + APP_VERSION
        run: |
          set -euo pipefail
          cd k8s/overlays/dev
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          yq -i '(.[] | select(.path == "/spec/template/spec/containers/0/env/0/value")).value = strenv(TAG)' patch-rollout.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/dev
          git commit -m "deploy(dev): bump image to ${TAG} [manual-approval pipeline]" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: ArgoCD sync (dev)
        run: |
          set -euo pipefail
          argocd app sync bluegreen-demo-dev \
            --server "${{ secrets.ARGOCD_SERVER }}" --plaintext --grpc-web --grpc-web-root-path argocd \
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --timeout 180

      - name: Wait for preview to be ready
        run: bash ci/scripts/wait-for-phase.sh dev Paused,Healthy 180

      - id: smoke
        name: Smoke test dev preview
        run: bash ci/scripts/smoke-test.sh /dev-bluegreen-preview "${TAG}"

      - name: Promote dev (smoke test passed)
        if: success()
        run: |
          set -euo pipefail
          PHASE=$(kubectl get rollout bluegreen-demo -n dev -o jsonpath='{.status.phase}')
          if [ "$PHASE" == "Paused" ]; then
            kubectl argo rollouts promote bluegreen-demo -n dev
          else
            echo "Rollout already at phase=${PHASE} (first revision auto-completes with nothing to promote) - skipping promote"
          fi
          bash ci/scripts/wait-for-phase.sh dev Healthy 180

      - name: Abort dev (smoke test failed)
        if: failure() && steps.smoke.outcome == 'failure'
        run: kubectl argo rollouts abort bluegreen-demo -n dev

  # This job doesn't start until a required reviewer on the "test-promotion"
  # environment approves it in the Actions UI (Actions tab -> this run ->
  # "Review deployments"). GitHub pauses the WHOLE job here - nothing below,
  # including checkout, runs until approved. Reject it and the job (and the
  # pipeline) just stops; test is never touched, same as an automated abort.
  deploy-test:
    needs: [deploy-dev, build-and-push]
    if: success()
    environment:
      name: test-promotion
    runs-on: [self-hosted, poc-cluster]
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUBECONFIG: /home/ec2-user/.kube/ci-deployer.config
    steps:
      - uses: actions/checkout@v4

      - name: Bump test overlay image tag + APP_VERSION
        run: |
          set -euo pipefail
          cd k8s/overlays/test
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          yq -i '(.[] | select(.path == "/spec/template/spec/containers/0/env/0/value")).value = strenv(TAG)' patch-rollout.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/overlays/test
          git commit -m "deploy(test): bump image to ${TAG} [approved by reviewer]" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: ArgoCD sync (test)
        run: |
          set -euo pipefail
          argocd app sync bluegreen-demo-test \
            --server "${{ secrets.ARGOCD_SERVER }}" --plaintext --grpc-web --grpc-web-root-path argocd \
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --timeout 180

      - name: Wait for test rollout to auto-promote (Healthy)
        run: bash ci/scripts/wait-for-phase.sh test Healthy 180

      - name: Smoke test test active
        run: bash ci/scripts/smoke-test.sh /test-bluegreen "${TAG}"
