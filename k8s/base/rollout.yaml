apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: bluegreen-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bluegreen-demo
  template:
    metadata:
      labels:
        app: bluegreen-demo
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: rahulnayak11631/bluegreen-demo:placeholder
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "placeholder"
            - name: APP_COLOR
              value: "blue"
            - name: APP_HEALTHY
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          # This cluster auto-injects an APM agent (Instana) into every pod,
          # which adds ~45-50s of bytecode-instrumentation overhead to a cold
          # JVM start - plain readiness/liveness with short initialDelaySeconds
          # killed the container before it ever finished starting once
          # (observed: Tomcat took ~44s to initialize, liveness probe's
          # default initialDelaySeconds: 15 fired well before that and
          # restarted it in a loop). A startupProbe defers readiness/liveness
          # until the app answers once, however long that takes (up to
          # 30 * 5s = 150s here), then normal probing takes over.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
  strategy:
    blueGreen:
      activeService: bluegreen-demo-active
      previewService: bluegreen-demo-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
